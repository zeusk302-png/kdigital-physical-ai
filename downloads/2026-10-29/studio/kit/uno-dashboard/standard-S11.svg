<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 236" role="img" aria-labelledby="title desc"><title id="title">같은 화면도 사용 목적에 따라 평가가 달라집니다</title><desc id="desc">사용자·상황: 집에서 공부하는 나 / 해야 할 일: 밝기 확인 → LED 제어 / 완료 근거: 최신값·응답·실물 구별. 효과성: 일을 마쳤나?     효율성: 노력은?     만족도: 경험은?</desc><rect width="920" height="236" rx="12" fill="#eff5ef"/><g font-family="Malgun Gothic, sans-serif" fill="#254c38"><text x="24" y="34" font-size="19" font-weight="700">같은 화면도 사용 목적에 따라 평가가 달라집니다</text><rect x="24.0" y="57" width="281.3333333333333" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="39.0" y="84" font-size="12" fill="#557960">01</text><text x="39.0" y="113" font-size="19" font-weight="700">사용자·상황</text><text x="39.0" y="145" font-size="13">집에서 공부하는 나</text><rect x="319.3333333333333" y="57" width="281.3333333333333" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="334.3333333333333" y="84" font-size="12" fill="#557960">02</text><text x="334.3333333333333" y="113" font-size="19" font-weight="700">해야 할 일</text><text x="334.3333333333333" y="145" font-size="13">밝기 확인 → LED 제어</text><rect x="614.6666666666666" y="57" width="281.3333333333333" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="629.6666666666666" y="84" font-size="12" fill="#557960">03</text><text x="629.6666666666666" y="113" font-size="19" font-weight="700">완료 근거</text><text x="629.6666666666666" y="145" font-size="13">최신값·응답·실물 구별</text><text x="24" y="207" font-size="17">효과성: 일을 마쳤나?     효율성: 노력은?     만족도: 경험은?</text></g></svg>