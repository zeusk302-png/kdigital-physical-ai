<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 236" role="img" aria-labelledby="title desc"><title id="title">버튼을 누른 것과 실제 출력은 별도로 확인합니다</title><desc id="desc">화면 요청: LED 켜기를 전송 / 코드 응답: 해당 요청 적용 응답 / 보드 보고 상태: LED 상태 필드 확인 / 실물 관찰: 눈으로 점등 확인. 응답이 없으면 적용 미확인 · 실물은 따로 관찰</desc><rect width="920" height="236" rx="12" fill="#eff5ef"/><g font-family="Malgun Gothic, sans-serif" fill="#254c38"><text x="24" y="34" font-size="19" font-weight="700">버튼을 누른 것과 실제 출력은 별도로 확인합니다</text><rect x="24.0" y="57" width="207.5" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="39.0" y="84" font-size="12" fill="#557960">01</text><text x="39.0" y="113" font-size="19" font-weight="700">화면 요청</text><text x="39.0" y="145" font-size="13">LED 켜기를 전송</text><rect x="245.5" y="57" width="207.5" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="260.5" y="84" font-size="12" fill="#557960">02</text><text x="260.5" y="113" font-size="19" font-weight="700">코드 응답</text><text x="260.5" y="145" font-size="13">해당 요청 적용 응답</text><rect x="467.0" y="57" width="207.5" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="482.0" y="84" font-size="12" fill="#557960">03</text><text x="482.0" y="113" font-size="19" font-weight="700">보드 보고 상태</text><text x="482.0" y="145" font-size="13">LED 상태 필드 확인</text><rect x="688.5" y="57" width="207.5" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="703.5" y="84" font-size="12" fill="#557960">04</text><text x="703.5" y="113" font-size="19" font-weight="700">실물 관찰</text><text x="703.5" y="145" font-size="13">눈으로 점등 확인</text><text x="24" y="207" font-size="17">응답이 없으면 적용 미확인 · 실물은 따로 관찰</text></g></svg>