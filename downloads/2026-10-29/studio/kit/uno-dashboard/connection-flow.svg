<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc"><title id="title">P01 센서와 웹 화면의 USB 왕복</title><desc id="desc">센서 입력은 UNO와 USB를 거쳐 웹 화면으로 전달된다. 반대 방향 명령은 요청번호를 가지고 LED를 제어하며 보드 응답과 실제 점등을 구별한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#08785d" stroke-width="2"/></marker></defs><rect width="1040" height="570" fill="#f3f5ef"/><g font-family="Malgun Gothic, sans-serif" fill="#19392a"><text x="32" y="47" font-size="25" font-weight="bold">한 번의 연결, 두 방향의 확인</text><text x="32" y="83" font-size="17">입력 → 화면 / 화면 명령 → 코드 적용 → 응답 → 실제 출력 관찰</text><g fill="white" stroke="#8eaa98"><rect x="32" y="130" width="235" height="150" rx="12"/><rect x="398" y="130" width="235" height="150" rx="12"/><rect x="764" y="130" width="244" height="150" rx="12"/></g><text x="53" y="166" font-size="21" font-weight="bold">P01 입력과 출력</text><text x="53" y="201" font-size="17">CdS · 가변저항 · DHT11</text><text x="53" y="234" font-size="17">버튼 · LED · LCD</text><text x="419" y="166" font-size="21" font-weight="bold">UNO P01 코드</text><text x="419" y="201" font-size="17">핀 읽기 · 기준 판단</text><text x="419" y="234" font-size="17">JSON · 요청번호 응답</text><text x="786" y="166" font-size="21" font-weight="bold">PC Chrome / Edge</text><text x="786" y="201" font-size="17">Web Serial · USB</text><text x="786" y="234" font-size="17">현재값 · 이력 · 제어</text><g fill="none" stroke="#08785d" stroke-width="3" marker-end="url(#arrow)"><path d="M275 175H383"/><path d="M641 175H748"/><path d="M748 245H641"/><path d="M383 245H275"/></g><text x="290" y="151" font-size="16">입력</text><text x="655" y="151" font-size="16">JSON</text><text x="650" y="274" font-size="16">USB 명령</text><text x="287" y="274" font-size="16">LED 적용</text><rect x="32" y="331" width="976" height="104" rx="9" fill="#e5eee6"/><text x="54" y="367" font-size="19">명령 예: 8 LED 1 → 같은 요청 #8의 보드 응답 → 다음 상태 보고</text><text x="54" y="402" font-size="18">응답은 프로그램 적용 근거입니다. 실제 LED 점등은 눈으로 따로 확인합니다.</text><text x="32" y="481" font-size="18">화면 파일: GitHub Pages 또는 localhost / 장치 통신: 이 PC의 USB</text><text x="32" y="519" font-size="18">전체 모듈 동시 연결·외부전원 없는 모터 구동·원격 장치 공개를 뜻하지 않습니다.</text><text x="32" y="553" font-size="16">연습 모드는 화면용 가짜 자료이며 실제 장치 확인과 구별합니다.</text></g></svg>
