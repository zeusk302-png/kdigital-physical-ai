<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 236" role="img" aria-labelledby="title desc"><title id="title">다른 조건에서도 읽고 조작할 수 있게 만듭니다</title><desc id="desc">인식: 색 + 상태 글자 / 운용: Tab → Enter 조작 / 이해: 오류 이유·복구 안내 / 견고성: 이름·역할 있는 버튼. 스크린샷의 모양과 실제 키보드·보조 기술 동작을 구별</desc><rect width="920" height="236" rx="12" fill="#eff5ef"/><g font-family="Malgun Gothic, sans-serif" fill="#254c38"><text x="24" y="34" font-size="19" font-weight="700">다른 조건에서도 읽고 조작할 수 있게 만듭니다</text><rect x="24.0" y="57" width="207.5" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="39.0" y="84" font-size="12" fill="#557960">01</text><text x="39.0" y="113" font-size="19" font-weight="700">인식</text><text x="39.0" y="145" font-size="13">색 + 상태 글자</text><rect x="245.5" y="57" width="207.5" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="260.5" y="84" font-size="12" fill="#557960">02</text><text x="260.5" y="113" font-size="19" font-weight="700">운용</text><text x="260.5" y="145" font-size="13">Tab → Enter 조작</text><rect x="467.0" y="57" width="207.5" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="482.0" y="84" font-size="12" fill="#557960">03</text><text x="482.0" y="113" font-size="19" font-weight="700">이해</text><text x="482.0" y="145" font-size="13">오류 이유·복구 안내</text><rect x="688.5" y="57" width="207.5" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="703.5" y="84" font-size="12" fill="#557960">04</text><text x="703.5" y="113" font-size="19" font-weight="700">견고성</text><text x="703.5" y="145" font-size="13">이름·역할 있는 버튼</text><text x="24" y="207" font-size="17">스크린샷의 모양과 실제 키보드·보조 기술 동작을 구별</text></g></svg>