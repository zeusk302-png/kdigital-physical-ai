<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 236" role="img" aria-labelledby="title desc"><title id="title">확인 결과를 다음 설계에 반영합니다</title><desc id="desc">상황 이해: 누구의 어떤 일인가 / 요구 정의: 필요한 조건은 무엇인가 / 설계안: 스케치·문구·동작 / 평가·수정: 직접 확인 → 다시 설계. 원칙은 설계 내내 보는 관점 · 활동은 실제로 하는 일</desc><rect width="920" height="236" rx="12" fill="#eff5ef"/><g font-family="Malgun Gothic, sans-serif" fill="#254c38"><text x="24" y="34" font-size="19" font-weight="700">확인 결과를 다음 설계에 반영합니다</text><rect x="24.0" y="57" width="207.5" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="39.0" y="84" font-size="12" fill="#557960">01</text><text x="39.0" y="113" font-size="19" font-weight="700">상황 이해</text><text x="39.0" y="145" font-size="13">누구의 어떤 일인가</text><rect x="245.5" y="57" width="207.5" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="260.5" y="84" font-size="12" fill="#557960">02</text><text x="260.5" y="113" font-size="19" font-weight="700">요구 정의</text><text x="260.5" y="145" font-size="13">필요한 조건은 무엇인가</text><rect x="467.0" y="57" width="207.5" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="482.0" y="84" font-size="12" fill="#557960">03</text><text x="482.0" y="113" font-size="19" font-weight="700">설계안</text><text x="482.0" y="145" font-size="13">스케치·문구·동작</text><rect x="688.5" y="57" width="207.5" height="113" rx="8" fill="#fff" stroke="#aac6b1"/><text x="703.5" y="84" font-size="12" fill="#557960">04</text><text x="703.5" y="113" font-size="19" font-weight="700">평가·수정</text><text x="703.5" y="145" font-size="13">직접 확인 → 다시 설계</text><text x="24" y="207" font-size="17">원칙은 설계 내내 보는 관점 · 활동은 실제로 하는 일</text></g></svg>