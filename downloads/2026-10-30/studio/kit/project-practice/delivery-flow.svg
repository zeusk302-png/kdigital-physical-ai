<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 242" role="img"><title>각 결과는 다음 판단의 입력입니다</title><desc>문제·요구: 필요·범위·완료 / 설계·작업: 구조·계약·담당 / 구현·시험: 변경·기대·실제 / 제공·운영: 버전·복구·인계</desc><rect width="1100" height="242" rx="12" fill="#eef4ec"/><g font-family="Malgun Gothic,sans-serif" fill="#254c38"><text x="24" y="35" font-size="21" font-weight="700">각 결과는 다음 판단의 입력입니다</text><rect x="24.0" y="60" width="254.0" height="112" rx="7" fill="#fff" stroke="#b0c8b1"/><text x="37.0" y="86" font-size="12">01</text><text x="37.0" y="116" font-size="19" font-weight="700">문제·요구</text><text x="37.0" y="147" font-size="13">필요·범위·완료</text><rect x="290.0" y="60" width="254.0" height="112" rx="7" fill="#fff" stroke="#b0c8b1"/><text x="303.0" y="86" font-size="12">02</text><text x="303.0" y="116" font-size="19" font-weight="700">설계·작업</text><text x="303.0" y="147" font-size="13">구조·계약·담당</text><rect x="556.0" y="60" width="254.0" height="112" rx="7" fill="#fff" stroke="#b0c8b1"/><text x="569.0" y="86" font-size="12">03</text><text x="569.0" y="116" font-size="19" font-weight="700">구현·시험</text><text x="569.0" y="147" font-size="13">변경·기대·실제</text><rect x="822.0" y="60" width="254.0" height="112" rx="7" fill="#fff" stroke="#b0c8b1"/><text x="835.0" y="86" font-size="12">04</text><text x="835.0" y="116" font-size="19" font-weight="700">제공·운영</text><text x="835.0" y="147" font-size="13">버전·복구·인계</text><text x="24" y="211" font-size="17">검토·위험·변경·시험은 여러 활동에 걸쳐 반복할 수 있습니다</text></g></svg>
